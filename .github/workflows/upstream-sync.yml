name: Sync main with upstream NanoClaw

# Keep this fork's main current with upstream nanocoai/nanoclaw. Every 4 hours
# (or manual dispatch), merge upstream main into main and push.
#
# Unlike band/adapter — a purely additive overlay that never conflicts and so is
# pushed directly by sync-band-adapter.yml — main carries the fork's own changes
# to core (the Band seams), so an upstream merge CAN conflict. Two-tier policy:
#   - trivially-safe paths auto-resolve via .gitattributes (union / take-upstream)
#   - a real conflict in a core seam is NEVER auto-resolved: the job opens (or
#     refreshes) a PR of upstream -> main, requests review from the integrations
#     team, assigns the owner, leaves main untouched, and FAILS RED so the
#     conflict is noticed. Resolve by hand, then push main.
#
# ci.yml runs only on PRs, so a direct push to main gets no CI. To avoid landing a
# clean-but-broken merge, this job build+tests the merged result (the same checks
# as ci.yml) before pushing — that pre-push gate is the only one main gets here.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream nanocoai/nanoclaw ref to merge
        required: false
        type: string
        default: main
      dry_run:
        description: Merge + validate without pushing main
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */4 * * *'

# Never let two syncs race on pushing main.
concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-main:
    if: github.repository == 'band-ai/nanoclaw-band'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: nanocoai/nanoclaw
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      # Where a conflict PR routes for manual resolution.
      REVIEW_TEAM: band-ai/integrations
      CONFLICT_ASSIGNEE: nir-singher-band
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name  "upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream into main (auto-adopt safe paths; PR on real conflict)
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_REF}"
          BASE="upstream/${UPSTREAM_REF}"

          # Already current? nothing to do.
          behind=$(git rev-list --count "HEAD..${BASE}")
          if [ "$behind" -eq 0 ]; then
            echo "main already contains ${UPSTREAM_REPO}@${UPSTREAM_REF} — nothing to sync."
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "main is ${behind} commit(s) behind ${BASE} — merging it in."

          # Register the custom driver referenced by .gitattributes: `theirs`
          # unconditionally takes the upstream side for generated artifacts the
          # fork never hand-edits (%A=ours/output, %B=theirs). Append-only docs
          # use the built-in `union`. Everything else conflicts as usual — the
          # fork's core seams (Band adapter, router, migrations) are NEVER
          # auto-resolved; those need human judgment.
          git config merge.theirs.driver 'cp -f %B %A'

          # Auto-adopt the safe paths; a real conflict is anything left over.
          if git merge --no-edit "$BASE"; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(git rev-parse --short "$BASE")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Real conflict in a fork seam. Leave main untouched, but surface an
          # actionable PR instead of a silent failure. Idempotent across the
          # schedule: one branch (auto/upstream-sync = upstream's tip), one open
          # PR reused (commented) until a human resolves and pushes main.
          conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
          git merge --abort || true
          # Record the conflict state before any routing step can fail — the
          # always-run Summary keys off this, and a red exit must never read as
          # "up to date".
          echo "status=conflict" >> "$GITHUB_OUTPUT"
          SYNC_BRANCH="auto/upstream-sync"
          git push -f origin "${BASE}:refs/heads/${SYNC_BRANCH}"
          short=$(git rev-parse --short "$BASE")
          body=$(printf '%s\n' \
            "Automatic upstream sync of \`${UPSTREAM_REPO}@${UPSTREAM_REF}\` (\`${short}\`) hit conflicts and left \`main\` untouched." \
            "" \
            "**Conflicting files:**" \
            "${conflicts}" \
            "" \
            "Resolve locally, then this PR auto-closes when main catches up:" \
            '```' \
            "git fetch origin upstream && git checkout main && git pull" \
            "git merge upstream/${UPSTREAM_REF}   # resolve, run the CI gate, commit" \
            "git push origin main" \
            '```')
          existing=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number -q '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh pr create --head "$SYNC_BRANCH" --base main \
              --title "⚠️ Upstream sync needs manual resolution" --body "$body" \
              --reviewer "$REVIEW_TEAM" --assignee "$CONFLICT_ASSIGNEE" || true
            existing=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number -q '.[0].number' || true)
          else
            # Keep the routing sticky on the already-open PR, then ping it.
            gh pr edit "$existing" --add-reviewer "$REVIEW_TEAM" --add-assignee "$CONFLICT_ASSIGNEE" || true
            gh pr comment "$existing" --body "$body" || true
          fi
          echo "conflict_pr=${existing}" >> "$GITHUB_OUTPUT"

          # Fail the run on purpose: a red job is the notification that a conflict
          # happened. The PR (assigned to ${CONFLICT_ASSIGNEE}, review requested
          # from ${REVIEW_TEAM}) is the actionable artifact; main is untouched
          # either way.
          echo "::error::Upstream merge conflicts — opened/updated PR ${SYNC_BRANCH} → main (assignee ${CONFLICT_ASSIGNEE}, review ${REVIEW_TEAM}); main left untouched."
          exit 1

      - name: Set up pnpm
        if: steps.merge.outputs.status == 'merged'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.merge.outputs.status == 'merged'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Bun
        if: steps.merge.outputs.status == 'merged'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Validate merged main (same checks as ci.yml)
        if: steps.merge.outputs.status == 'merged'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          ( cd container/agent-runner && bun install --frozen-lockfile )
          pnpm run format:check
          pnpm exec tsc --noEmit
          pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit
          pnpm exec vitest run
          ( cd container/agent-runner && bun test )

      - name: Push main
        if: steps.merge.outputs.status == 'merged' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Fast-forward of main (we started at main and added a merge commit).
          # If main moved meanwhile the non-FF push is rejected; the next run retries.
          git push origin HEAD:main
          echo "main synced to ${UPSTREAM_REPO}@${UPSTREAM_REF} (${{ steps.merge.outputs.base_sha }})."

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sync main with upstream"
            echo
            echo "- Upstream: \`${UPSTREAM_REPO}@${UPSTREAM_REF}\`"
            case "${{ steps.merge.outputs.status }}" in
              merged)
                echo "- Merged upstream \`${{ steps.merge.outputs.base_sha }}\` into main"
                if [ "${DRY_RUN}" = "true" ]; then
                  echo "- Dry run: validated, **not** pushed"
                else
                  echo "- Pushed to \`main\`"
                fi
                ;;
              conflict)
                echo "- ⚠️ Upstream merge hit conflicts — **main left untouched**"
                echo "- Resolve via PR #${{ steps.merge.outputs.conflict_pr }} (assignee \`${CONFLICT_ASSIGNEE}\`, review \`${REVIEW_TEAM}\`)"
                ;;
              uptodate)
                echo "- main already up to date — nothing to sync"
                ;;
              *)
                echo "- ⚠️ Sync step did not complete — see job logs"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
