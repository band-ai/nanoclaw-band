name: Sync main with upstream NanoClaw

# Keep this fork's main current with upstream nanocoai/nanoclaw. Every 4 hours
# (or manual dispatch): measure drift, try the merge, validate it, push main —
# and when any of that can't happen, hand a human an owned, reviewable PR.
#
# Three hard-won constraints shape this job; changing it without them in mind
# will re-break it:
#
# 1. WE CANNOT PUSH ANY REF THAT CARRIES UPSTREAM WORKFLOW CHANGES. `workflows`
#    is not a key in the Actions `permissions:` vocabulary, so GITHUB_TOKEN can
#    never be granted it; upstream ships .github/workflows/*, so the moment an
#    upstream merge touches those files EVERY push of it is rejected with
#    "refusing to allow a GitHub App to create or update workflow ... without
#    workflows permission" — sync branch AND main alike. (The Jul 1-4 auto-syncs
#    only worked because those merges happened not to touch workflow files; the
#    Jul 13 one that did had to be pushed by a human.) There is no REST detour:
#    POST /git/refs, PATCH /git/refs/{ref} and PUT /contents/{path} all require
#    the same permission. So the push is BEST-EFFORT, never load-bearing.
#
# 2. THE ESCALATION MUST NOT SHARE A FAILURE MODE WITH THE WORK. The previous
#    version pushed a sync branch and then opened a PR from it, under
#    `set -euo pipefail` — so the rejected push killed the step before
#    `gh pr create`, and 40 consecutive runs produced no branch, no PR and no
#    assignee. This version opens the PR with the head in the PARENT repo
#    (head=<upstream owner>:<ref>), so no ref is ever created here and the
#    escalation path touches nothing that can be permission-denied. It must be
#    issued via `gh api` — `gh pr create --head org:branch` rejects an
#    organization-owned head (cli/cli#10093).
#
# 3. GREEN != CURRENT. A job that no-ops silently is worse than one that fails
#    loudly, so the verdict step fails on STALENESS (commits behind / age of the
#    newest upstream commit we contain) independently of whether the merge step
#    exited 0. Prior art: a comparable fork's monitor stayed green for five
#    months while a full release behind.
#
# Unlike band/adapter — a purely additive overlay that never conflicts and so is
# pushed directly by sync-band-adapter.yml — main carries the fork's own changes
# to core (the Band seams), so an upstream merge CAN conflict. Two-tier policy:
#   - trivially-safe paths auto-resolve via .gitattributes (union / take-upstream)
#   - a real conflict in a core seam is NEVER auto-resolved
#
# ci.yml runs only on PRs, so a direct push to main gets no CI. To avoid landing a
# clean-but-broken merge, this job build+tests the merged result (the same checks
# as ci.yml) before pushing — that pre-push gate is the only one main gets here.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream nanocoai/nanoclaw ref to merge
        required: false
        type: string
        default: main
      dry_run:
        description: Merge + validate without pushing main
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */4 * * *'

# Never let two syncs race on pushing main.
concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-main:
    if: github.repository == 'band-ai/nanoclaw-band'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: nanocoai/nanoclaw
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      # Where an escalation PR routes for manual resolution.
      REVIEW_TEAM: band-ai/integrations
      CONFLICT_ASSIGNEE: nir-singher-band
      # Staleness alarm. Exceeding either fails the run even if nothing errored,
      # so a sync that quietly stops adopting upstream cannot read as healthy.
      MAX_BEHIND_COMMITS: '200'
      MAX_BASELINE_AGE_DAYS: '14'
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name  "upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Read-only. Touches no refs, so it cannot fail for permission reasons and
      # always produces the numbers the verdict step judges.
      - name: Measure drift against upstream
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_REF}"
          BASE="upstream/${UPSTREAM_REF}"

          behind=$(git rev-list --count "HEAD..${BASE}")
          ahead=$(git rev-list --count "${BASE}..HEAD")
          # Newest upstream commit we already contain; its age is how stale our
          # baseline is, independent of how many commits that represents.
          baseline=$(git merge-base HEAD "$BASE")
          baseline_ts=$(git log -1 --format=%ct "$baseline")
          baseline_age_days=$(( ( $(date -u +%s) - baseline_ts ) / 86400 ))

          stale=false
          if [ "$behind" -gt "$MAX_BEHIND_COMMITS" ] || [ "$baseline_age_days" -gt "$MAX_BASELINE_AGE_DAYS" ]; then
            stale=true
          fi

          {
            echo "behind=${behind}"
            echo "ahead=${ahead}"
            echo "baseline=$(git rev-parse --short "$baseline")"
            echo "baseline_age_days=${baseline_age_days}"
            echo "base_sha=$(git rev-parse --short "$BASE")"
            echo "stale=${stale}"
          } >> "$GITHUB_OUTPUT"

          echo "main is ${behind} behind / ${ahead} ahead of ${BASE}; baseline is ${baseline_age_days} day(s) old."

      # Never fails the run: records an outcome the later steps branch on, so a
      # conflict can no longer prevent its own escalation.
      - name: Merge upstream into main (auto-adopt safe paths)
        id: merge
        shell: bash
        env:
          BEHIND: ${{ steps.drift.outputs.behind }}
        run: |
          set -uo pipefail
          if [ "$BEHIND" -eq 0 ]; then
            echo "main already contains ${UPSTREAM_REPO}@${UPSTREAM_REF} — nothing to sync."
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Register the custom driver referenced by .gitattributes: `theirs`
          # unconditionally takes the upstream side for generated artifacts the
          # fork never hand-edits (%A=ours/output, %B=theirs). Append-only docs
          # use the built-in `union`. Everything else conflicts as usual — the
          # fork's core seams (Band adapter, router, migrations) are NEVER
          # auto-resolved; those need human judgment.
          git config merge.theirs.driver 'cp -f %B %A'

          if git merge --no-edit "upstream/${UPSTREAM_REF}"; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo 'conflicts<<CONFLICTS_EOF'
            git diff --name-only --diff-filter=U | sed 's/^/- /'
            echo 'CONFLICTS_EOF'
          } >> "$GITHUB_OUTPUT"
          git merge --abort || true
          echo "status=conflict" >> "$GITHUB_OUTPUT"
          echo "::warning::Upstream merge conflicts in fork seams — main left untouched; escalating to a PR."

      - name: Set up pnpm
        if: steps.merge.outputs.status == 'merged'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.merge.outputs.status == 'merged'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Bun
        if: steps.merge.outputs.status == 'merged'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      # continue-on-error so a red gate still reaches the escalation below. The
      # verdict step branches on `.outcome`, never `.conclusion` — a
      # continue-on-error step reports conclusion=success even when it failed.
      - name: Validate merged main (same checks as ci.yml)
        id: gate
        if: steps.merge.outputs.status == 'merged'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          ( cd container/agent-runner && bun install --frozen-lockfile )
          pnpm run format:check
          pnpm exec tsc --noEmit
          pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit
          pnpm exec vitest run
          ( cd container/agent-runner && bun test )

      # Best-effort by design (constraint 1): rejected when the merge carries
      # upstream workflow-file changes. A rejection is recorded, not fatal — the
      # PR below then becomes the path a human uses to land it.
      - name: Push main
        id: push
        if: steps.merge.outputs.status == 'merged' && steps.gate.outcome == 'success' && env.DRY_RUN != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.drift.outputs.base_sha }}
        run: |
          set -uo pipefail
          # Fast-forward of main (we started at main and added a merge commit).
          # If main moved meanwhile the non-FF push is rejected; the next run retries.
          if git push origin HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "main synced to ${UPSTREAM_REPO}@${UPSTREAM_REF} (${BASE_SHA})."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pushing merged main was rejected — escalating to a PR instead."
          fi

      # The always-available escalation. Head lives in the PARENT repo, so no ref
      # is created here and nothing in this step can be permission-denied
      # (constraint 2). Idempotent: one open PR per upstream head, refreshed with
      # a comment instead of duplicated.
      - name: Open or refresh the upstream-sync PR
        id: escalate
        if: always() && steps.merge.outputs.status != 'uptodate' && steps.push.outputs.pushed != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Step outputs arrive as env vars, never interpolated into the script:
          # `conflicts` is multiline, and inline ${{ }} would splice raw text into
          # the shell source.
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BASE_SHA: ${{ steps.drift.outputs.base_sha }}
          BEHIND: ${{ steps.drift.outputs.behind }}
          AHEAD: ${{ steps.drift.outputs.ahead }}
          BASELINE: ${{ steps.drift.outputs.baseline }}
          BASELINE_AGE_DAYS: ${{ steps.drift.outputs.baseline_age_days }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          UPSTREAM_OWNER="${UPSTREAM_REPO%%/*}"
          HEAD_REF="${UPSTREAM_OWNER}:${UPSTREAM_REF}"

          case "$MERGE_STATUS" in
            conflict) reason="hit conflicts in fork seams, so \`main\` was left untouched" ;;
            merged)
              if [ "$GATE_OUTCOME" != "success" ]; then
                reason="merged cleanly but FAILED the pre-push gate (build/format/typecheck/tests)"
              else
                reason="merged cleanly and passed the gate, but pushing \`main\` was rejected (a merge carrying upstream workflow-file changes cannot be pushed by this job — see the header of upstream-sync.yml)"
              fi
              ;;
            *) reason="did not complete — see the job log" ;;
          esac

          body=$(printf '%s\n' \
            "Automatic sync of \`${UPSTREAM_REPO}@${UPSTREAM_REF}\` (\`${BASE_SHA}\`) ${reason}." \
            "" \
            "- \`main\` is **${BEHIND} behind / ${AHEAD} ahead** of upstream" \
            "- newest upstream commit we contain: \`${BASELINE}\` (**${BASELINE_AGE_DAYS} day(s)** old)" \
            "- run: ${RUN_URL}" \
            "" \
            "**Conflicting files:**" \
            "${CONFLICTS:-- (none — see the reason above)}" \
            "" \
            "This PR's head is upstream's branch, so it cannot take resolution commits. Resolve locally and push \`main\`:" \
            '```' \
            "git fetch upstream && git checkout main && git pull" \
            "git merge upstream/${UPSTREAM_REF}   # resolve, run the CI gate, commit" \
            "git push origin main" \
            '```' \
            "" \
            "Once \`main\` contains upstream's tip this PR is closed automatically by the next run.")

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" -X GET \
            -f state=open -f head="${HEAD_REF}" -f base=main --jq '.[0].number' 2>/dev/null || true)

          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" -X POST \
              -f title="⚠️ Upstream sync needs manual resolution" \
              -f head="${HEAD_REF}" -f base=main -f body="$body" --jq '.number' 2>&1) || {
                echo "::error::Could not open the upstream-sync PR: ${existing}"
                echo "opened=false" >> "$GITHUB_OUTPUT"
                exit 0
              }
            echo "Opened PR #${existing} (${HEAD_REF} -> main)."
          else
            gh pr comment "$existing" --body "$body" || echo "::warning::Could not comment on PR #${existing}."
            echo "Refreshed PR #${existing}."
          fi

          # Routing is advisory: never let a failed assignment hide the PR.
          gh pr edit "$existing" --add-assignee "$CONFLICT_ASSIGNEE" \
            || echo "::warning::Could not assign ${CONFLICT_ASSIGNEE} on PR #${existing}."
          gh pr edit "$existing" --add-reviewer "$REVIEW_TEAM" \
            || echo "::warning::Could not request review from ${REVIEW_TEAM} on PR #${existing}."

          {
            echo "opened=true"
            echo "pr=${existing}"
          } >> "$GITHUB_OUTPUT"

      # Deterministic cleanup rather than relying on GitHub to notice: when main
      # has caught up, close any open sync PR.
      - name: Close the sync PR once main has caught up
        if: always() && (steps.merge.outputs.status == 'uptodate' || steps.push.outputs.pushed == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          UPSTREAM_OWNER="${UPSTREAM_REPO%%/*}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" -X GET \
            -f state=open -f head="${UPSTREAM_OWNER}:${UPSTREAM_REF}" -f base=main --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh pr close "$existing" --comment "main now contains \`${UPSTREAM_REPO}@${UPSTREAM_REF}\` — closing." \
              || echo "::warning::Could not close PR #${existing}."
          fi

      # Single place that decides red vs green, and names why. Runs last so every
      # escalation has already happened.
      - name: Verdict
        if: always()
        shell: bash
        env:
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          SYNC_PR: ${{ steps.escalate.outputs.pr }}
          STALE: ${{ steps.drift.outputs.stale }}
          BASE_SHA: ${{ steps.drift.outputs.base_sha }}
          BEHIND: ${{ steps.drift.outputs.behind }}
          AHEAD: ${{ steps.drift.outputs.ahead }}
          BASELINE: ${{ steps.drift.outputs.baseline }}
          BASELINE_AGE_DAYS: ${{ steps.drift.outputs.baseline_age_days }}
        run: |
          set -uo pipefail
          status="${MERGE_STATUS:-}"
          gate="${GATE_OUTCOME:-}"
          pushed="${PUSHED:-}"
          pr="${SYNC_PR:-}"
          stale="${STALE:-}"
          fail=''

          {
            echo "## Sync main with upstream"
            echo
            echo "- Upstream: \`${UPSTREAM_REPO}@${UPSTREAM_REF}\` (\`${BASE_SHA}\`)"
            echo "- Drift: **${BEHIND} behind / ${AHEAD} ahead**; baseline \`${BASELINE}\` is **${BASELINE_AGE_DAYS} day(s)** old"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            uptodate) echo "- main already up to date — nothing to sync" >> "$GITHUB_STEP_SUMMARY" ;;
            merged)
              if [ "$gate" != "success" ]; then
                echo "- ❌ merged cleanly but the pre-push gate FAILED — main left untouched" >> "$GITHUB_STEP_SUMMARY"
                fail="the merged tree fails the pre-push gate"
              elif [ "$pushed" = "true" ]; then
                echo "- ✅ merged, validated and pushed to \`main\`" >> "$GITHUB_STEP_SUMMARY"
              elif [ "${DRY_RUN}" = "true" ]; then
                echo "- merged and validated; dry run, **not** pushed" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- ⚠️ merged and validated, but the push to \`main\` was rejected" >> "$GITHUB_STEP_SUMMARY"
                fail="the validated merge could not be pushed (needs a human, or a credential with the Workflows permission)"
              fi
              ;;
            conflict)
              echo "- ⚠️ conflicts in fork seams — **main left untouched**" >> "$GITHUB_STEP_SUMMARY"
              fail="upstream merge conflicts need manual resolution"
              ;;
            *)
              echo "- ⚠️ the merge step did not complete — see the job log" >> "$GITHUB_STEP_SUMMARY"
              fail="the merge step did not complete"
              ;;
          esac

          if [ -n "$pr" ]; then
            echo "- Resolve via PR #${pr} (assignee \`${CONFLICT_ASSIGNEE}\`, review \`${REVIEW_TEAM}\`)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$fail" ] && [ "$status" != "uptodate" ]; then
            echo "- ❌ no escalation PR exists — the escalation step itself failed; see the job log" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$stale" = "true" ]; then
            echo "- ❌ **stale**: over ${MAX_BEHIND_COMMITS} commits behind or a baseline older than ${MAX_BASELINE_AGE_DAYS} days" >> "$GITHUB_STEP_SUMMARY"
            fail="${fail:+${fail}; }fork is stale beyond the alarm thresholds"
          fi

          if [ -n "$fail" ]; then
            echo "::error::${fail}${pr:+ (PR #${pr})}"
            exit 1
          fi
